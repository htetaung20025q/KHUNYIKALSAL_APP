<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <defs>
    <linearGradient id="gp_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="gp_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F076"/>
      <stop offset="100%" stop-color="#00BA4F"/>
    </linearGradient>
    <linearGradient id="gp_yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDA00"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="gp_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E21B38"/>
    </linearGradient>
  </defs>
  <rect width="160" height="50" rx="10" ry="10" fill="#000000" stroke="#a6a6a6" stroke-width="1"/>
  <!-- Google Play Triangle -->
  <g transform="translate(14, 11) scale(1.15)">
    <!-- Blue left -->
    <path d="M1.3 0.8C1.1 1.1 1 1.5 1 2v20c0 .5.1.9.3 1.2l11.1-11.1L1.3 0.8z" fill="url(#gp_blue)"/>
    <!-- Red bottom -->
    <path d="M16.1 15.8L12.4 12.1 1.3 23.2c.4.2 1 .2 1.6-.1l13.2-7.3z" fill="url(#gp_red)"/>
    <!-- Green top -->
    <path d="M16.1 8.2L2.9.9C2.3.6 1.7.6 1.3.8l11.1 11.3 3.7-3.9z" fill="url(#gp_green)"/>
    <!-- Yellow right -->
    <path d="M21.1 11.1l-5 2.8-3.7-3.8 3.7-3.9 5 2.8c1.2.7 1.2 1.8 0 2.5z" fill="url(#gp_yellow)"/>
  </g>
  <!-- Text -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="18" font-size="8" font-weight="600" letter-spacing="0.8" fill="#d1d5db">GET IT ON</text>
    <text x="48" y="35" font-size="15" font-weight="700" letter-spacing="-0.3">Google Play</text>
  </g>
</svg>
